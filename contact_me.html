<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="home.html">Wasi Khan</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li><a class="nav-link" href="home.html">Home</a></li>
                    <li><a class="nav-link" href="about.html">About</a></li>
                    <li><a class="nav-link" href="portfolio.html">Portfolio</a></li>
                    <li><a class="nav-link" href="services.html">Services</a></li>
                    <li><a class="nav-link active" href="contact_me.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5 text-center text-white" style="background: linear-gradient(135deg,#111827,#0f172a)">
        <div class="container pt-5">
            <h1 class="display-4 fw-bold">Contact Me</h1>
            <p class="lead">Let's build something awesome together</p>
        </div>
    </section>

    <section class="py-5 bg-dark">
        <div class="container">
            <div class="row g-5 align-items-start">
                <div class="col-lg-4 text-white">
                    <h3 class="mb-4">Get in Touch</h3>
                    <p class="mb-3"><i class="bi bi-envelope me-3 text-primary"></i> wasi.khan@example.com</p>
                    <p class="mb-3"><i class="bi bi-telephone me-3 text-primary"></i> +880 17xx-xxxxxx</p>
                    <p class="mb-4"><i class="bi bi-geo-alt me-3 text-primary"></i> Dhaka, Bangladesh</p>
                    <div class="d-flex gap-3">
                        <a href="#" class="btn btn-outline-light"><i class="bi bi-github"></i></a>
                        <a href="#" class="btn btn-outline-light"><i class="bi bi-linkedin"></i></a>
                        <a href="#" class="btn btn-outline-light"><i class="bi bi-facebook"></i></a>
                    </div>
                </div>

                <div class="col-lg-7">
                    <h3 class="text-white mb-4 text-center text-lg-start">Send Message</h3>
                    <div class="card bg-card border-0 p-4 p-lg-5 rounded-4 shadow">
                        <form id="contactForm" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="text-white mb-1">Name</label>
                                    <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="text-white mb-1">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                                </div>
                                <div class="col-12">
                                    <label class="text-white mb-1">Phone (Optional)</label>
                                    <input type="text" class="form-control" id="phone" placeholder="+880 17xxxxxxxx">
                                </div>
                                <div class="col-12">
                                    <label class="text-white mb-1">Subject</label>
                                    <input type="text" class="form-control" id="subject" placeholder="Project Inquiry" required>
                                </div>
                                <div class="col-12">
                                    <label class="text-white mb-1">Message</label>
                                    <textarea class="form-control" id="message" rows="5" placeholder="Tell me about your project..." required></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg px-5">Send Message</button>
                                    <span id="status" class="ms-3 fw-bold"></span>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <h2 class="section-title text-white text-center mb-5">Find Me Here</h2>
            <div class="shadow-lg overflow-hidden rounded-4">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3651.9!2d90.4078!3d23.8103!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755b8b7a55cd36f%3A0xfcc5c28d1c3e!2sDhaka!5e0!3m2!1sen!2sbd!4v1234567890"
                    width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
    </section>

    <footer class="py-3 text-center text-muted border-top border-secondary">
        <p class="mb-0">© <span id="year"></span> Wasi Khan. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
