<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-glass navbar-light">
        <div class="container">
            <a class="navbar-brand" href="#">Wasi Khan</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav text-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact-us.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <header class="page-header">
            <h1 class="display-4 fw-bold">Get In Touch</h1>
        </header>

        <div class="container py-5">
            <div class="row g-4 text-center mb-5">
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow hover-card p-4">
                        <div class="fs-1 text-primary mb-2">📍</div>
                        <h4 class="fw-bold">Address</h4>
                        <p class="text-secondary">123 Tech Avenue, Dhaka</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow hover-card p-4">
                        <div class="fs-1 text-primary mb-2">📞</div>
                        <h4 class="fw-bold">Phone</h4>
                        <p class="text-secondary">+880 1700-000000</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow hover-card p-4">
                        <div class="fs-1 text-primary mb-2">✉️</div>
                        <h4 class="fw-bold">Email</h4>
                        <p class="text-secondary">hello@wasikhan.com</p>
                    </div>
                </div>
            </div>

            <div class="row justify-content-center mb-5">
                <div class="col-lg-8">
                    <div class="card shadow border-0 p-4 p-md-5">
                        <h3 class="text-center fw-bold text-primary mb-4">Send Message</h3>
                        <form id="contactForm">
                            <div class="row g-3">
                                <div class="col-md-6"><input type="text" id="name" class="form-control" placeholder="Your Name" required></div>
                                <div class="col-md-6"><input type="email" id="email" class="form-control" placeholder="Your Email" required></div>
                                <div class="col-md-6"><input type="text" id="phone" class="form-control" placeholder="Phone Number"></div>
                                <div class="col-md-6"><input type="text" id="address" class="form-control" placeholder="Address"></div>
                                <div class="col-12"><textarea id="message" rows="5" class="form-control" placeholder="Your Message" required></textarea></div>
                                <div class="col-12 text-center"><button type="submit" class="btn btn-primary w-50">Submit</button></div>
                            </div>
                        </form>
                        <p id="formSuccess" class="text-success fw-bold text-center mt-3 d-none">Message Sent Successfully!</p>
                    </div>
                </div>
            </div>

            <div class="rounded shadow overflow-hidden">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3651.902442430139!2d90.39108331536267!3d23.750858094676464!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755b888ad3b91bf%3A0xb272459505c24e!2sDhaka!5e0!3m2!1sen!2sbd!4v1626071488052!5m2!1sen!2sbd" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <p class="mb-0">Copyright © <span id="live-time"></span> - Wasi Khan</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
